services:
  # 1. AI Service (FastAPI)
  - type: web
    name: flowfund-ai-service
    runtime: docker
    dockerContext: ./code/ai-service
    dockerfilePath: ./code/ai-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: AI_SERVICE_SECRET
        sync: false

  # 2. Backend Service (Spring Boot)
  - type: web
    name: flowfund-backend
    runtime: docker
    dockerContext: ./code/backend
    dockerfilePath: ./code/backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_SECRET
        sync: false
      - key: AI_SERVICE_URL
        value: http://flowfund-ai-service:8000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ARIMA_API_URL
        value: http://flowfund-ai-service:8000/forecast
      - key: FRONTEND_URL
        sync: false
